name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK via Web2App Action
      uses: jlowe2/web2app-action@v1.0.0
      with:
        app-name: 'Devkumar Calculator'
        web-folder: '.'
        output-apk-name: 'app-debug.apk'

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-APK
        path: app-debug.apk
