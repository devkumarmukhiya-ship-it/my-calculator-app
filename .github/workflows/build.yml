name: Build Android Webview APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Webview App
      run: |
        npm install -g cordova
        cordova create app com.devkumar.calculator "Devkumar Calculator"
        cp index.html app/www/index.html
        cd app
        cordova platform add android
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
