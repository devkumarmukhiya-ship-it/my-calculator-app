name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Webview APK using Cordova
      run: |
        npm install -g cordova
        cordova create myApp com.devkumar.calculator "Devkumar Calculator"
        cd myApp
        cp ../index.html www/index.html
        cordova platform add android@10.1.2 --nostart
        cordova build android --debug -- --gradleArg=-PcdvBuildToolsVersion=33.0.0

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-APK
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
