name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova and Build APK
      run: |
        npm install -g cordova
        cordova create myApp com.devkumar.calculator "Devkumar Calculator"
        cd myApp
        cp ../index.html www/index.html
        cordova platform add android@10.1.2
        cordova build android --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-APK
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
