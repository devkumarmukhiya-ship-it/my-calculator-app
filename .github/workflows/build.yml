name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Generate Android Project using Bubblewrap
      run: |
        npm install -g @bubblewrap/cli
        mkdir pwa
        cp index.html pwa/
        if [ -f config.xml ]; then cp config.xml pwa/; fi
        
        # Simple Android Webview Wrapper
        npm install -g cordova
        cordova create app com.devkumar.calculator "Devkumar Calculator"
        cp -r pwa/* app/www/
        cd app
        cordova platform add android@12.0.0 --nostart
        cordova build android --device

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
